<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelat</title>
    <style>
        table, td, th{
            border:1px solid;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Firstname</th>
                <th>Lastname</th>
                <th>Age</th>
                <th>Email</th>
            </tr>
        </thead>
    <tbody>
            <tr>
                <td>Drin</td>
                <td>Dalpi</td>
                <td>22</td>
                <td>drin@gmail.com</td>
            </tr>
            <tr>
                <td>Mart</td>
                <td>Berisha</td>
                <td>10</td>
                <td>mart.berisha@gmail.com</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Table Footer</td>
            </tr>
        </tfoot>
    </table>
    <br>
    <hr>
    <table>
        <tr>
            <th>Name: </th>
            <td>John Doe</td>
            <td>Richard Roe</td>
        </tr>
        <tr>
            <th rowspan="2">Email:</th>
            <td>john2@gmail.com</td>
            <td rowspan="2">richard@gmail.com</td>
        </tr>
        <tr>
            <td>john2@gmail.com</td>
        </tr>
    </table>
</body>
</html>
